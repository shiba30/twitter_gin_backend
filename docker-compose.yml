version: "3.8"
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: twitter
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      DBUSER: user
      DBPASS: password
    volumes:
      - .:/twitter_clone
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
