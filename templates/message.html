<!DOCTYPE html>
<html>

<head>
    <title>Twitter Clone</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
</head>

<body>
    <div class="container">
        <div class="main-container pt-3 pr-5 pl-5">
            {{template "header.html" .}}
            <div class="content d-flex flex-row">
                {{template "sidebar.html" .}}
                <div class="col-md-9 border-left">
                    <h2 class="m-3">Messages</h2>
                    <div class="d-flex justify-content-between" style="min-height: 80vh;">
                        <div id="follows" class="d-flex flex-column flex-grow-1 m-3" style="overflow-y: auto;">
                            <!-- フォローリスト一覧表示 -->
                            {{range .follows}}
                            <a data-follower-id="{{.FollowerID}}" data-followee-id="{{.FolloweeID}}"
                                class="follow-link d-flex border-bottom mt-3">
                                {{.AvatarImage}}
                                {{if .AvatarImage}}
                                <img src="{{ .AvatarImage }}" width="30" height="30" class="mr-3">
                                {{else}}
                                <img src="/static/img/default_avatar.png" width="30" height="30" class="mr-3">
                                {{end}}
                                <div class="mb-3 pt-1">{{.DisplayName}}</div>
                            </a>
                            {{end}}
                        </div>
                        <div class="border-right"></div>
                        <div class="d-flex flex-column flex-grow-1 justify-content-between">
                            <div id="messages" class="d-flex flex-column m-3"
                                style="overflow-y: auto; max-height: 70vh;">
                                <!-- メッセージ表示 -->
                            </div>
                            <div class="d-flex ml-5 mb-3">
                                <input type="text" id="messageInput" class="form-control"
                                    placeholder="Start a new message...">
                                <button onclick="sendMessage()" class="btn btn-primary ml-4">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/message.js"></script>
</body>

</html>
