<!DOCTYPE html>
<html>

<head>
    <title>Twitter Clone</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
</head>

<body>
    <div class="container">
        <div class="main-container pt-3 pr-5 pl-5">
            {{template "header.html" .}}
            <div class="content d-flex flex-row">
                {{template "sidebar.html" .}}
                <div class="col-md-9 border-left pl-0 pr-0">
                    <h2 class="m-3">
                        <button onclick="history.back()" class="btn-goback">←</button>Post
                    </h2>
                    <div>
                        <div class="border-bottom d-flex flex-row m-3 pb-3">
                            <div class="pr-3">
                                {{ if .UserImage.Valid }}
                                <img src="{{ .UserImage.String }}" width="50" height="50">
                                {{ else }}
                                <img src="{{ $.avatarImage }}" width="50" height="50">
                                {{ end }}
                            </div>
                            <div>
                                <div>
                                    {{ .displayName }}
                                </div>
                                <div>
                                    {{ .TweetContent }}
                                </div>
                                {{ if .ImagePath.Valid }}
                                <div>
                                    <img src="/{{ .ImagePath.String }}" width="50" height="50">
                                </div>
                                {{ end }}
                                <div class="mb-3">
                                    <!-- TODO Reply,Retweet,Likes area -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="border-bottom d-flex flex-row">
                        <div class="col-1">
                            <img src="{{ .avatarImage }}" width="50" height="50">
                        </div>
                        <div class="col-11">
                            <form class="m-3" id="replyForm" data-user-id="{{ .userId }}">
                                <div class="form-group">
                                    <textarea id="replyContent" class="tweetarea form-control" maxlength="140"
                                        placeholder="Post your reply" style="background-color: #fff;"></textarea>
                                </div>

                                <!-- 画像プレビュー -->
                                <div class="image-preview mt-3 mb-3 d-flex align-items-center justify-content-center">
                                    <img id="selectedImagePreview" src="#" alt="Selected Image">
                                </div>

                                <hr color="#fff" max-width="800">
                                <!-- ファイルアップロード -->
                                {{template "upload.html" .}}
                                <button type="submit" id="postReply"
                                    class="btn btn-primary float-right mb-3 rounded-pill btn-custom">Reply</button>
                            </form>
                        </div>
                    </div>

                    <!-- リプライ一覧表示 -->
                    <div id="repliesList" class="replies-list"></div>
                </div>
            </div>
        </div>
        <script src="/static/js/tweet_detail.js"></script>
</body>

</html>
