<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="signup-container">
                    <div class="d-flex flex-row justify-content-center">
                        <img src="/static/img/twitter.png" width="80" height="80">
                        <h1 class="text-center mt-3">Sign up for Twitter</h1>
                    </div>

                    <form id="signupForm" class="d-flex flex-column justify-content-end">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="form-group mb-5">
                            <label for="displayName">Display Name</label>
                            <input type="text" class="form-control" id="displayName" required maxlength="50">
                        </div>
                        <div class="form-group text-right">
                            <button type="submit" class="btn btn-primary btn-custom">add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/signup.js"></script>
</body>

</html>
